<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>TikTok Recharge</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body { margin:0; background:#f4f4f6; font-family: sans-serif; display:flex; justify-content:center; }
  .app { width:min(100vw,430px); min-height:100vh; position:relative; }
  .card { background:#fff; margin:10px; padding:15px; border-radius:12px; }
  .input { width:100%; height:40px; border:1px solid #ddd; border-radius:8px; padding:0 10px; box-sizing:border-box; margin-bottom:10px; }
  .btn { width:100%; height:44px; background:#fe1742; color:#fff; border:0; border-radius:8px; font-weight:bold; }
  
  /* 浮动飘屏层 */
  #float-container { position:fixed; bottom:100px; left:12px; width:260px; pointer-events:none; z-index:999; }
  .msg { background:rgba(0,0,0,0.6); color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; margin-top:5px; animation:slide 0.3s ease-out; }
  @keyframes slide { from { transform:translateX(-20px); opacity:0; } to { transform:translateX(0); opacity:1; } }
</style>
</head>
<body>

<div class="app">
  <!-- 充值界面 -->
  <div class="card">
    <h3>Recharge Coins</h3>
    <input class="input" placeholder="TikTok Username" />
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
      <button class="btn" style="background:#eee; color:#000;">30</button>
      <button class="btn" style="background:#eee; color:#000;">350</button>
      <button class="btn" style="background:#eee; color:#000;">700</button>
    </div>
    <button class="btn" style="margin-top:10px;">Confirm Payment</button>
  </div>

  <!-- 直播监控区 -->
  <div class="card">
    <input id="target" class="input" placeholder="Enter Host ID to Monitor" />
    <button id="connectBtn" class="btn" style="background:#28a85b;">Start Monitor</button>
  </div>

  <!-- 实时飘屏层 -->
  <div id="float-container"></div>
</div>

<script>
  const socket = io();
  const container = document.getElementById('float-container');
  
  document.getElementById('connectBtn').onclick = () => {
    socket.emit('setTarget', document.getElementById('target').value);
  };

  socket.on('liveData', (data) => {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = data.type === 'chat' ? `<b>${data.nickname}</b>: ${data.comment}` : `🎁 ${data.nickname}送了${data.giftName}`;
    container.prepend(div);
    setTimeout(() => div.remove(), 4000);
  });
</script>
</body>
</html>
